<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2b2b2b">
    <title>Contador Casio 90s</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">
        <div class="brand">CASIO <span>ELECTRONIC COUNTER</span></div>
        
        <!-- Display principal de repeticiones -->
        <div class="screen-container">
            <div id="display" class="display">0</div>
        </div>

        <!-- Botón CONTAR gigante -->
        <div class="controls">
            <button id="btn-count" class="btn btn-count">CONTAR</button>
        </div>

        <!-- Fila inferior: Botón BORRAR + Display TIME al lado -->
        <div class="bottom-panel">
            <button id="btn-reset" class="btn btn-reset">BORRAR</button>
            <div class="timer-container">
                <span class="timer-label">TIME</span>
                <span id="timer-display" class="timer-display">00:00</span>
            </div>
        </div>
    </div>

    <script>
        let count = 0;
        let timerSeconds = 0;
        let timerInterval = null;
        let isTimerRunning = false;

        const display = document.getElementById('display');
        const timerDisplay = document.getElementById('timer-display');
        const btnCount = document.getElementById('btn-count');
        const btnReset = document.getElementById('btn-reset');

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toString().padStart(2, '0');
            return `${mins}:${secs}`;
        }

        function startTimer() {
            if (!isTimerRunning) {
                isTimerRunning = true;
                timerInterval = setInterval(() => {
                    timerSeconds++;
                    timerDisplay.textContent = formatTime(timerSeconds);
                }, 1000);
            }
        }

        function stopAndResetTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            isTimerRunning = false;
            timerSeconds = 0;
            timerDisplay.textContent = formatTime(0);
        }

        btnCount.addEventListener('click', () => {
            count++;
            display.textContent = count;
            startTimer();
        });

        btnReset.addEventListener('click', () => {
            count = 0;
            display.textContent = count;
            stopAndResetTimer();
        });
    </script>
</body>
</html>
